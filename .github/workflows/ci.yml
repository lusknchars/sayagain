name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy sayagain tests
        if: matrix.python-version == '3.12'
      - run: uv run pytest -q
      # Dry run only: a real run needs the edge-tts endpoint and a whisper
      # model download, neither of which belongs on every push.
      - run: uv run sayagain run examples/ --adapter mock --dry-run
